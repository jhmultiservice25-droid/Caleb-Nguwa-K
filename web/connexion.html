<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>État Civil RDC — Connexion</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="mobile.css"><style>.auth-wrap{min-height:calc(100vh - 78px);display:grid;grid-template-columns:1.05fr .95fr}.auth-visual{background:linear-gradient(135deg,#082f59,#0e5d9d);color:#fff;padding:80px;display:flex;flex-direction:column;justify-content:center}.auth-visual h1{font:700 48px Arial,sans-serif;margin:10px 0}.auth-card{display:flex;align-items:center;justify-content:center;padding:40px}.auth-box{width:min(480px,100%);background:#fff;border:1px solid #dce7f4;border-radius:4px;box-shadow:0 20px 60px rgba(7,45,85,.12);padding:28px}.auth-box h2{font:700 30px Arial,sans-serif;color:#103564;margin-top:0}.auth-switch{display:flex;gap:8px;margin-bottom:18px}.auth-switch a{flex:1;text-align:center;padding:10px;border:1px solid #c9d8ea;border-radius:3px;font-weight:800}.auth-switch a.active{background:#00a7e1;color:#fff}.auth-box .field{margin-bottom:14px}.auth-box button{width:100%;justify-content:center}.resend{margin-top:10px;background:#fff;border:1px solid #c9d8ea;color:#0b5fc6;padding:10px;cursor:pointer}@media(max-width:900px){.auth-wrap{grid-template-columns:1fr}.auth-visual{padding:40px}.auth-visual h1{font-size:38px}}</style></head><body><header class="topbar"><a class="brand" href="index.html"><span class="emblem">RDC</span><span><small>RÉPUBLIQUE DÉMOCRATIQUE DU CONGO</small><strong>ÉTAT CIVIL RDC</strong></span></a><nav class="nav"><a href="index.html">Accueil</a><a href="centres.html">Centres</a><a href="verification.html">Vérification</a></nav><div class="top-actions"><span class="secure">🔒 Accès sécurisé</span><span class="flag">🇨🇩</span></div></header><main class="auth-wrap"><section class="auth-visual"><div class="eyebrow">ACCÈS SÉCURISÉ</div><h1>Une administration moderne, au service du citoyen.</h1><p>Connectez-vous pour suivre vos demandes. Pour une nouvelle inscription, utilisez la page dédiée.</p></section><section class="auth-card"><div class="auth-box"><div class="auth-switch"><a id="login-tab" class="active" href="connexion.html">Connexion</a><a id="signup-tab" href="inscription.html">Créer un compte</a></div><section id="login-section"><h2>Connexion</h2><form id="login-form"><div class="field"><label>Adresse e-mail</label><input name="username" type="email" autocomplete="username" required></div><div class="field"><label>Mot de passe</label><input name="password" type="password" autocomplete="current-password" required></div><button class="btn btn-primary" type="submit">Se connecter</button><button class="resend" type="button" id="resend-confirmation-btn">Renvoyer l’e-mail de confirmation</button></form></section></div></section></main><div class="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="cloud.js"></script><script src="app.js"></script><script src="cloud-overrides.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const b=document.querySelector('#resend-confirmation-btn');if(!b)return;b.addEventListener('click',async()=>{const email=document.querySelector('#login-form input[name="username"]')?.value.trim();if(!email){toast('Saisissez d’abord votre adresse e-mail.');return}try{await EtatCivilCloud.resendSignupEmail(email);toast('E-mail de confirmation renvoyé. Vérifiez votre boîte de réception et les courriers indésirables.')}catch(e){toast(e.message||'Impossible de renvoyer l’e-mail de confirmation.')}})})</script></body></html>
