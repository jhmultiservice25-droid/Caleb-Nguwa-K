<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>État Civil RDC — Créer un compte citoyen</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="mobile.css"></head><body><header class="topbar"><a class="brand" href="index.html"><span class="emblem">RDC</span><span><small>RÉPUBLIQUE DÉMOCRATIQUE DU CONGO</small><strong>ÉTAT CIVIL RDC</strong></span></a></header><main style="min-height:calc(100vh - 78px);display:flex;align-items:center;justify-content:center;padding:24px"><section style="width:min(520px,100%);background:#fff;padding:28px;border:1px solid #dce7f4;border-radius:6px;box-shadow:0 20px 60px rgba(7,45,85,.12)"><div class="eyebrow">ESPACE CITOYEN</div><h1>Créer votre compte</h1><p>Créez votre compte pour déposer et suivre vos demandes d’état civil.</p><div id="signup-error" style="display:none;padding:12px;margin:12px 0;background:#fff5f5;border:1px solid #efcaca;color:#9d2424"></div><div id="signup-success" style="display:none;padding:12px;margin:12px 0;background:#f4fff8;border:1px solid #bfe3cf;color:#17643f"></div><form id="signup-form"><div class="field"><label>Nom complet *</label><input name="fullname" autocomplete="name" required></div><div class="field"><label>Adresse e-mail *</label><input name="email" type="email" autocomplete="email" required></div><div class="field"><label>Téléphone *</label><input name="phone" type="tel" autocomplete="tel" placeholder="+243..." required></div><div class="field"><label>Mot de passe *</label><input name="password" type="password" autocomplete="new-password" minlength="8" required><small>8 caractères minimum.</small></div><button id="signup-submit" class="btn btn-primary" type="submit">Créer mon compte</button></form><p style="margin-top:18px"><a href="connexion.html">J’ai déjà un compte</a></p></section></main><div class="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="cloud.js"></script><script src="app.js"></script><script src="cloud-overrides.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const f=document.querySelector('#signup-form'),err=document.querySelector('#signup-error'),ok=document.querySelector('#signup-success'),btn=document.querySelector('#signup-submit');if(!f)return;f.addEventListener('submit',async e=>{e.preventDefault();e.stopImmediatePropagation();if(!f.reportValidity())return;err.style.display='none';ok.style.display='none';const p=Object.fromEntries(new FormData(f));const email=String(p.email||'').trim().toLowerCase(),fullname=String(p.fullname||'').trim(),phone=String(p.phone||'').trim(),password=String(p.password||'');try{btn.disabled=true;btn.textContent='Création du compte…';if(password.length<8)throw new Error('Le mot de passe doit contenir au moins 8 caractères.');const redirectTo=(location.hostname==='localhost'||location.hostname==='127.0.0.1')?`${location.origin}/connexion.html?confirmed=1`:'https://etat-civil-rdc.vercel.app/connexion.html?confirmed=1';const {data,error}=await EtatCivilCloud.client.auth.signUp({email,password,options:{emailRedirectTo:redirectTo,data:{full_name:fullname,phone}}});if(error)throw error;f.reset();ok.textContent=data.session?'Compte créé avec succès.':'Compte créé. Vérifiez votre e-mail pour confirmer votre adresse, puis connectez-vous.';ok.style.display='block';if(data.session)setTimeout(()=>location.href='citoyen.html',700);else setTimeout(()=>location.href='connexion.html',1800)}catch(x){let m=String(x?.message||'Création du compte impossible.');if(/already registered|already been registered|user already exists/i.test(m))m='Cette adresse possède déjà un compte. Utilisez Connexion ou renvoyez l’e-mail de confirmation.';if(/redirect.*url|not allowed/i.test(m))m='L’adresse de confirmation n’est pas autorisée par la configuration Supabase.';err.textContent=m;err.style.display='block'}finally{btn.disabled=false;btn.textContent='Créer mon compte'}},true)})</script></body></html>
